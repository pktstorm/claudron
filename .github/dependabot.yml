version: 2

updates:
  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      # One PR for the routine noise rather than a dozen. Majors stay separate,
      # because those are the ones that need a human to read a changelog.
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  # The workflows themselves are a supply-chain surface: a compromised action
  # runs with whatever permissions the job grants it.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
