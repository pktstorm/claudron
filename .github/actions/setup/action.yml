name: Set up toolchains
description: Node with Corepack-pinned Yarn, Rust with caching, and dependencies installed.

inputs:
  rust-components:
    description: Extra rustup components, e.g. "clippy, rustfmt".
    required: false
    default: ""

runs:
  using: composite
  steps:
    # Corepack must be enabled BEFORE setup-node's yarn cache runs, because
    # that cache step shells out to yarn while the runner is still on its
    # bundled Yarn 1 -- which cannot read a Yarn 4 lockfile.
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version: 24

    - name: Enable Corepack
      shell: bash
      run: corepack enable

    - name: Cache Yarn
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: .yarn/cache
        key: ${{ runner.os }}-yarn-${{ hashFiles('yarn.lock') }}
        restore-keys: ${{ runner.os }}-yarn-

    - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable @ 2026-08-02
      with:
        components: ${{ inputs.rust-components }}

    - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      with:
        workspaces: src-tauri

    - name: Install dependencies
      shell: bash
      run: yarn install --immutable
