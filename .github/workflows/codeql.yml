name: CodeQL

# Semantic analysis of both halves of the codebase. Free on public repos.
# Rust support went GA in October 2025; TypeScript has been mature for years.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, so newly-published queries find old code. A vulnerability class
    # discovered next month should surface without anyone touching the repo.
    - cron: "17 6 * * 1"

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze:
    name: analyze (${{ matrix.language }})
    runs-on: macos-latest
    permissions:
      security-events: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        language: [rust, javascript-typescript]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          languages: ${{ matrix.language }}
          # security-and-quality is broader than the default security-only
          # suite: it also reports maintainability issues worth seeing on a
          # codebase this size.
          queries: security-and-quality

      # Rust scanning is buildless as of the October 2025 GA, and the
      # TypeScript extractor never needed a build, so no build step is needed
      # for either language.
      - name: Analyze
        uses: github/codeql-action/analyze@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4.37.4
        with:
          category: /language:${{ matrix.language }}
