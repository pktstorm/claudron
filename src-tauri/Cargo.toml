[package]
name = "claudron-app"
version = "0.1.0"
license = "MIT"
description = "A pane of glass over every Claude Code session on your machine"
repository = "https://github.com/pktstorm/claudron"
authors = ["Caitlin Halla", "Sam Thirlwall"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "claudron_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.11", features = ["tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
dirs = "6"
chrono = { version = "0.4.45", default-features = false, features = ["serde", "clock", "std"] }

[dev-dependencies]
tempfile = "3"

